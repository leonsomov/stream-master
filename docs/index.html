<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream Master</title>
  <meta name="description" content="Listener page for Stream Master sessions.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 id="page-title">Stream Master</h1>

  <div class="panel" id="main-panel">
    <div class="label" id="role-label">listening to room</div>
    <div class="id" id="room-id">(no room)</div>
    <div class="status" id="status">connecting</div>

    <button id="start-button" class="primary" hidden>Tap to listen</button>
    <button id="send-start-button" class="primary" hidden>Start sending test tone</button>

    <audio id="audio" autoplay playsinline></audio>
  </div>

  <div class="chat" id="chat" hidden>
    <div class="chat-label">SESSION CHAT</div>
    <div class="chat-log" id="chat-log" aria-live="polite"></div>
    <form class="chat-form" id="chat-form">
      <input
        type="text"
        id="chat-input"
        placeholder="type a message"
        autocomplete="off"
        maxlength="500"
      >
      <button type="submit">Send</button>
    </form>
  </div>

  <p class="footer">
    <span id="footer-mode">receiver</span>  /  WebRTC + Opus  /
    <a href="https://github.com/leonsomov/stream-master">source</a>
  </p>

  <script type="module" src="app.js"></script>
</body>
</html>
